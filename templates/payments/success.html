{% extends 'base.html' %}
{% block title %}Payment Successful{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card shadow-sm border-0 p-4">
        <div class="card-body">
          <div class="mb-3">
            <i class="fas fa-check-circle text-success fa-5x"></i>
          </div>
          <h2 class="text-success fw-bold">Payment Successful!</h2>
          <p class="text-muted lead mt-3">
            Thank you! Your payment has been processed and your premium recipe access is now active.
          </p>
          <div class="d-grid gap-2 col-8 mx-auto mt-4">
            <a href="{% url 'recipes:recipe_list' %}" class="btn btn-success btn-lg">
              <i class="fas fa-utensils me-2"></i> Browse Recipes
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
